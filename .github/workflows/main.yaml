name: Build Windows Executable

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PySide6 pandas openpyxl reportlab pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --add-data "fonts;fonts" --add-data "icons;icons" --add-data "style_1.qss;."  --name="mouain_app" main.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Windows-Executable
        path: dist/mouain_app.exe
